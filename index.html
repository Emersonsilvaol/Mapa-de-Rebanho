<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Pecuário</title>
</head>
<body style="margin:0">
<script>
(async function () {
  const url = "https://raw.githubusercontent.com/Emersonsilvaol/Mapa-de-Rebanho/864d5f34cbe5bc37ba2247c6225f2b1acc73f94e/index.html";
  try {
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const html = await r.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML =
      '<div style="font-family:Arial;padding:30px"><h2>Não foi possível carregar o Mapa de Rebanho.</h2><p>' +
      String(e) + '</p></div>';
  }
})();
</script>
</body>
</html>
