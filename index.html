<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de Rebanho | Fazenda Bodoquena</title><style>body{margin:0;background:#f7f8f7}#rebanho-original{min-height:100vh}#rebanho-original main{max-width:1440px;margin:auto}</style></head><body><div id="rebanho-original">
<style>
#rebanho-original{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f8f7;color:#2b322f}#rebanho-original *{box-sizing:border-box}#rebanho-original header{background:linear-gradient(135deg,#0f3b2e,#0a2a21);color:white;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}#rebanho-original h1{color:#ffffff!important;font-size:17px;letter-spacing:.3px;margin:0}#rebanho-original header p{font-size:11px;color:#c9a24b;margin:3px 0;text-transform:uppercase;letter-spacing:.4px}#rebanho-original .pill{font-size:11px;padding:6px 10px;border-radius:20px;border:1px solid #ffffff30;background:#ffffff14}#rebanho-original nav{background:#0a2a21;display:flex;flex-wrap:wrap;padding:0 16px;gap:2px}#rebanho-original button{font:inherit;border-radius:6px;border:1px solid #d9dddb;background:white;color:#0f3b2e;padding:7px 12px}#rebanho-original nav button{border:0;border-radius:0;border-bottom:3px solid transparent;background:transparent;color:#cfe0d8;font-size:13px;font-weight:600;padding:12px 16px}#rebanho-original nav button[aria-pressed=true]{border-bottom-color:#c9a24b;color:white}#rebanho-original main{padding:22px 18px}#rebanho-original h2{font-size:19px;color:#0f3b2e;margin:0 0 4px}#rebanho-original .sub{font-size:12px;color:#5b6663;margin:0 0 18px}#rebanho-original .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px 14px;margin-bottom:16px;background:white;border:1px solid #edefee;border-radius:8px;box-shadow:0 1px 3px #0f3b2e1f}#rebanho-original label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:#5b6663}#rebanho-original input,#rebanho-original select{font:13px Arial,sans-serif;padding:8px 9px;border:1px solid #d9dddb;border-radius:6px;background:white;color:#2b322f;max-width:100%}#rebanho-original .panel{background:white;border:1px solid #edefee;border-radius:8px;box-shadow:0 1px 3px #0f3b2e1f;margin-bottom:16px;overflow:hidden}#rebanho-original .panelhead{padding:12px 16px;background:#f7f8f7;border-bottom:1px solid #edefee;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:#0f3b2e;font-weight:600}#rebanho-original .panelbody{padding:16px}#rebanho-original .wrap{overflow-x:auto}#rebanho-original table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}#rebanho-original th{background:#0a2a21;color:white;font-size:11px;padding:9px 10px;text-align:left;white-space:nowrap}#rebanho-original td{padding:8px 10px;border-bottom:1px solid #edefee;white-space:nowrap}#rebanho-original .map th,#rebanho-original .map td{text-align:center;border:1px solid #edefee;padding:7px 9px}#rebanho-original .map .second th{background:#1c5c46}#rebanho-original .map .label{text-align:left;background:#f7f8f7;font-weight:600}#rebanho-original .map .bioma{background:#0a2a21;color:white;font-size:11px;font-weight:600}#rebanho-original .subtotal{background:#e8f0ec;font-weight:600}#rebanho-original .total td{background:#0a2a21;color:white;font-weight:700}#rebanho-original tbody tr:hover{background:#e8f0ec}#rebanho-original .pager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;font-size:12px}#rebanho-original button:disabled{opacity:.4}#rebanho-original .sisbov{color:#1c5c46;font-weight:600}#rebanho-original footer{font-size:11px;color:#5b6663;border-top:1px solid #d9dddb;padding:12px 18px}#rebanho-original [hidden]{display:none!important}@media(max-width:600px){#rebanho-original header{padding:14px}#rebanho-original main{padding:14px 10px}#rebanho-original header .pill{display:none}#rebanho-original nav{padding:0 4px}#rebanho-original nav button{padding:12px 10px}#rebanho-original input,#rebanho-original select{font-size:16px}#rebanho-original button{min-height:44px}}
#rebanho-original .map{border-collapse:separate;border-spacing:0}
#rebanho-original .map th,#rebanho-original .map td{border:0}
#rebanho-original .map tbody tr:not(.total) td{border-bottom:1px solid #dde5df}
#rebanho-original .map tbody tr:not(.total) td.bioma{border-bottom-color:#244b3c}
#rebanho-original .map td.sex-start{border-left:1px solid #cbd8cf}
#rebanho-original .map thead tr:first-child th:nth-child(4),#rebanho-original .map thead tr:first-child th:nth-child(5),#rebanho-original .map thead tr.second th:nth-child(6){border-left:1px solid #365e4d}
#rebanho-original .map tbody tr:not(.total):nth-child(even) td:not(.bioma):not(.subtotal){background:#f5f8f6}
#rebanho-original .map tbody tr:not(.total):hover td:not(.bioma){background:#e3ece6}
#rebanho-original .map .total td{border-top:2px solid #c9a24b;border-bottom:0}
#rebanho-original .map .subtotal{background:#e8f0ec}
#rebanho-original .map th.bioma{vertical-align:middle;background:#0f3b2e;color:#fff;font-size:13px;letter-spacing:.5px;padding:12px 14px;min-width:105px;border-right:3px solid #c9a24b;text-transform:uppercase}
#rebanho-original .map tr.group-start:not(:first-child)>*{border-top:8px solid #fff}
</style>
<header><div><h1>MAPA DE REBANHO</h1></div><span class="pill">Carregando…</span></header>
<nav aria-label="Telas de consulta"><button data-view="inicial" aria-pressed="false">Mapa Inicial</button><button data-view="mov" aria-pressed="false">Movimentações</button><button data-view="final" aria-pressed="true">Mapa Atual / Final</button></nav>
<main><h2 id="ro-title">Mapa Atual</h2><p class="sub" id="ro-sub">Mapa Inicial + todas as movimentações. Sem corte por data.</p>
<div class="toolbar"><label>SETOR<select id="ro-sector"><option value="">Todos os setores</option></select></label><label>SISBOV<input id="ro-search" type="search" placeholder="Digite o SISBOV"></label><label id="ro-type-label" hidden>TIPO<select id="ro-type"><option value="">Todos os tipos</option></select></label><button id="ro-clear">Limpar filtros</button><button id="ro-xlsx">Exportar XLSX</button><button id="ro-pdf">Exportar PDF</button></div><p class="sub" id="ro-export-status" role="status">Exportação completa da consulta · sem filtros, inclui todos os registros.</p>
<section class="panel" id="ro-map-panel"><div class="panelhead"><span>Mapa consolidado do rebanho</span><span id="ro-count"></span></div><div class="panelbody"><div class="wrap" id="ro-map"></div></div></section>
<section class="panel"><div class="panelhead"><span id="ro-list-title">Detalhamento dos Animais — Mapa Final</span><span id="ro-list-count" aria-live="polite">Carregando dados…</span></div><div class="panelbody"><div class="wrap" id="ro-list"></div><div class="pager"><span id="ro-page-count"></span><div><button id="ro-prev">Anterior</button> <button id="ro-next">Próxima</button></div></div></div></section>
</main><footer>Carregando dados do rebanho…</footer>

<script>
(async()=>{const root=document.getElementById('rebanho-original'),q=s=>root.querySelector(s);try{let data, currentHash='', loading=false;
const endpoint='https://ernbxfwhfqsriklqruhn.supabase.co/functions/v1/rebanho-publico';
const publicKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVybmJ4ZndoZnFzcmlrbHFydWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDM1ODEsImV4cCI6MjEwMzc3OTU4MX0.CDtA8MmEMLK0nPNI8os_SwqhTD7m8MljjNUNAxROEW4';
async function fetchData(){
 const r=await fetch(endpoint+(currentHash?'?hash='+encodeURIComponent(currentHash):''),{headers:{apikey:publicKey,Authorization:'Bearer '+publicKey},signal:AbortSignal.timeout(65000)});
 if(!r.ok)throw new Error('Dados indisponíveis ('+r.status+').');
 const result=await r.json();
 if(result.data){data=result.data;currentHash=result.meta.hash;}
 if(!data)throw new Error('Nenhuma base disponível.');
 q('footer').textContent='Base de '+data.dataFinal.split('-').reverse().join('/')+' · '+(result.meta.desatualizado?'Última versão salva · ':'Sincronizada em ')+new Date(result.meta.atualizadoEm).toLocaleString('pt-BR')+' · Conferência automática a cada minuto';
 q('.pill').textContent=data.final.length.toLocaleString('pt-BR')+' cabeças';
 return Boolean(result.data);
}
await fetchData();
const fmt=n=>n.toLocaleString('pt-BR');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='final',page=0;const size=15,cats=['00–12','13–24','25–36','36+'];for(const s of data.setores){const o=document.createElement('option');o.value=s;o.textContent=s;q('#ro-sector').append(o)}for(const t of [...new Set(data.mov.map(m=>m[1]))]){const o=document.createElement('option');o.value=t;o.textContent=t;q('#ro-type').append(o)}function category(date,ref){const d=new Date(date+'T00:00:00'),r=new Date(ref+'T00:00:00');const m=(r.getFullYear()-d.getFullYear())*12+r.getMonth()-d.getMonth()-(r.getDate()<d.getDate());return m<=12?0:m<=24?1:m<=36?2:3}let exportRows=[],exportColumns=[],mapSummary=[],biomeMerges=[];
const libraryPromises={};
function loadLibrary(url){return libraryPromises[url]||(libraryPromises[url]=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=resolve;script.onerror=()=>reject(new Error('Falha ao carregar o exportador.'));document.head.append(script)}));}
async function exportReport(format){
 const status=q('#ro-export-status');const rows=exportRows.map(a=>a.map((v,i)=>((view==='mov'&&i===0)||(view!=='mov'&&i===5))?v.split('-').reverse().join('/'):v));const columns=exportColumns.slice();const isMap=view!=='mov';const title=q('#ro-title').textContent;const scope='Setor: '+(q('#ro-sector').value||'Todos')+' | SISBOV: '+(q('#ro-search').value||'Todos')+(view==='mov'?' | Tipo: '+(q('#ro-type').value||'Todos'):'');const name=view==='mov'?'movimentacoes':view==='inicial'?'mapa_inicial':'mapa_final';const summary=mapSummary.map(r=>r.slice());const merges=biomeMerges.map(m=>({...m}));q('#ro-xlsx').disabled=q('#ro-pdf').disabled=true;status.textContent='Preparando '+rows.length.toLocaleString('pt-BR')+' registros…';
 try{
 if(format==='xlsx'){
 await loadLibrary('https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js');const wb=XLSX.utils.book_new();
 if(isMap){const headers=['Bioma','Seção',...cats.map(c=>'Fêmeas '+c),'Subtotal Fêmeas',...cats.map(c=>'Machos '+c),'Subtotal Machos','Total Seção'];const body=summary.map(r=>r.slice());for(const m of merges)for(let i=m.start+1;i<m.start+m.count;i++)body[i][0]='';const ws=XLSX.utils.aoa_to_sheet([[title],[scope],headers,...body]);ws['!merges']=merges.filter(m=>m.count>1).map(m=>({s:{r:m.start+3,c:0},e:{r:m.start+m.count+2,c:0}}));for(const m of merges){const cell=ws[XLSX.utils.encode_cell({r:m.start+3,c:0})];if(cell)cell.s={alignment:{vertical:'center',horizontal:'center'},fill:{fgColor:{rgb:'0F3B2E'}},font:{color:{rgb:'FFFFFF'},bold:true}};}ws['!cols']=headers.map((_,i)=>({wch:i<2?20:16}));XLSX.utils.book_append_sheet(wb,ws,'Mapa consolidado');}
 const ws=XLSX.utils.aoa_to_sheet([[title],[scope],columns,...rows]);ws['!cols']=columns.map((_,i)=>({wch:i===1&&view==='mov'?30:23}));for(let i=0;i<rows.length;i++){const key=XLSX.utils.encode_cell({r:i+3,c:view==='mov'?2:0});if(ws[key]){ws[key].t='s';ws[key].z='@';}}XLSX.utils.book_append_sheet(wb,ws,view==='mov'?'Movimentações':'Animais');XLSX.writeFile(wb,name+'.xlsx');
 }else{
 await loadLibrary('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadLibrary('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js');const doc=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});doc.setFontSize(15);doc.text(title,14,16);doc.setFontSize(9);doc.text(scope,14,23);const style={styles:{fontSize:8,cellPadding:2},headStyles:{fillColor:[10,42,33]},margin:{top:14,left:14,right:14,bottom:16}};
 if(isMap){const headers=['Bioma','Seção',...cats.map(c=>'F '+c),'Total F',...cats.map(c=>'M '+c),'Total M','Total'];doc.autoTable({...style,startY:29,head:[headers],body:summary.map((r,i)=>{const m=merges.find(m=>i>=m.start&&i<m.start+m.count);const cells=r.map((v,j)=>j>1?fmt(v):v);if(m&&i===m.start)cells[0]={content:r[0],rowSpan:m.count,styles:{valign:'middle',fillColor:[15,59,46],textColor:[255,255,255],fontStyle:'bold'}};else if(m)cells.shift();return cells;})});doc.addPage();}
 doc.autoTable({...style,startY:isMap?16:29,head:[columns],body:rows});const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.text('Mapa de Rebanho | '+rows.length.toLocaleString('pt-BR')+' registros | Página '+p+' de '+pages,14,202);}doc.save(name+'.pdf');}
 status.textContent='Arquivo gerado com '+rows.length.toLocaleString('pt-BR')+' registros.';
 }catch(e){status.textContent='Não foi possível exportar no site: '+e.message;}finally{q('#ro-xlsx').disabled=q('#ro-pdf').disabled=false;}
}
q('#ro-xlsx').onclick=()=>exportReport('xlsx');q('#ro-pdf').onclick=()=>exportReport('pdf');

function render(){const sector=q('#ro-sector').value,search=q('#ro-search').value.trim(),type=q('#ro-type').value,isMov=view==='mov';q('#ro-title').textContent=isMov?'Movimentações':view==='inicial'?'Mapa Inicial':'Mapa Atual';q('#ro-sub').textContent=isMov?'Lançamentos individuais por SISBOV. O filtro de setor considera origem ou destino.':view==='inicial'?'Animais da base inicial. Cadastros avulsos não compõem o saldo inicial. Mapa e SISBOV seguem os mesmos filtros.':'Mapa Inicial + todas as movimentações. Sem corte por data.';q('#ro-type-label').hidden=!isMov;q('#ro-map-panel').hidden=isMov;let rows;if(isMov){rows=data.mov.filter(m=>(!sector||m[3]===sector||m[4]===sector)&&(!search||m[2].includes(search))&&(!type||m[1]===type));}else{rows=data[view].filter(a=>(!sector||a[4]===sector)&&(!search||a[0].includes(search)));const biome=s=>data.biomas?.[s]||(['Margarida','Mutum'].includes(s)?'Pantanal':'Cerrado');const sectors=data.setores.filter(s=>!sector||s===sector).sort((a,b)=>biome(a).localeCompare(biome(b)));mapSummary=[];biomeMerges=[];const totals=Array(10).fill(0);let html='<table class="map"><thead><tr><th rowspan="2">Bioma</th><th rowspan="2">Seção</th><th colspan="5">Fêmeas</th><th colspan="5">Machos</th><th rowspan="2">Total Seção</th></tr><tr class="second">'+[...cats,'Subtotal',...cats,'Subtotal'].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';for(const [sectorIndex,s] of sectors.entries()){const groupStart=sectorIndex===0||biome(sectors[sectorIndex-1])!==biome(s);const groupSize=sectors.filter(x=>biome(x)===biome(s)).length;if(groupStart)biomeMerges.push({start:sectorIndex,count:groupSize});const a=rows.filter(a=>a[4]===s),vals=[];for(const sx of ['Fêmea','Macho']){const counts=cats.map((_,i)=>a.filter(a=>a[2]===sx&&category(a[5],view==='inicial'?data.dataInicial:data.dataFinal)===i).length);vals.push(...counts,counts.reduce((a,b)=>a+b,0))}vals.forEach((n,i)=>totals[i]+=n);mapSummary.push([biome(s),s,...vals,a.length]);html+='<tr class="'+(groupStart?'group-start':'')+'">'+(groupStart?'<th scope="rowgroup" class="bioma" rowspan="'+groupSize+'">'+biome(s)+'</th>':'')+'<td class="label">'+esc(s)+'</td>'+vals.map((n,i)=>'<td class="'+((i===4||i===9?'subtotal ':'')+(i===5?'sex-start':''))+'">'+fmt(n)+'</td>').join('')+'<td class="subtotal">'+fmt(a.length)+'</td></tr>'}mapSummary.push(['TOTAL GERAL','',...totals,rows.length]);html+='<tr class="total"><td colspan="2">TOTAL GERAL</td>'+totals.map(n=>'<td>'+fmt(n)+'</td>').join('')+'<td>'+fmt(rows.length)+'</td></tr></tbody></table>';q('#ro-map').innerHTML=html;q('#ro-count').textContent=fmt(rows.length)+' cabeças';}page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));q('#ro-list-title').textContent=isMov?'Lançamentos — SISBOV individual':'Detalhamento dos Animais — Mapa '+(view==='inicial'?'Inicial':'Final');q('#ro-list-count').textContent=fmt(rows.length)+(isMov?' lançamentos':' animais');const columns=isMov?['Data','Tipo','SISBOV','Origem','Destino','Sexo']:['SISBOV','Brinco','Sexo','Raça','Setor','Nascimento'];exportRows=rows;exportColumns=columns;q('#ro-list').innerHTML='<table><thead><tr>'+columns.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(page*size,(page+1)*size).map(a=>'<tr>'+a.map((v,i)=>'<td class="'+(i===(isMov?2:0)?'sisbov':'')+'">'+esc(((!isMov&&i===5)||(isMov&&i===0))?v.split('-').reverse().join('/'):v||'—')+'</td>').join('')+'</tr>').join('')+(rows.length?'':'<tr><td colspan="6">Nenhum registro encontrado.</td></tr>')+'</tbody></table>';q('#ro-page-count').textContent=rows.length?fmt(page*size+1)+'–'+fmt(Math.min((page+1)*size,rows.length))+' de '+fmt(rows.length)+' · todos os registros disponíveis':'0 registros';q('#ro-prev').disabled=page===0;q('#ro-next').disabled=(page+1)*size>=rows.length;}root.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;page=0;root.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(b===x)));render()});q('#ro-sector').onchange=q('#ro-type').onchange=q('#ro-search').oninput=()=>{page=0;render()};q('#ro-prev').onclick=()=>{page--;render()};q('#ro-next').onclick=()=>{page++;render()};q('#ro-clear').onclick=()=>{q('#ro-sector').value=q('#ro-type').value=q('#ro-search').value='';page=0;render()};render();setInterval(async()=>{if(loading||document.hidden)return;loading=true;try{if(await fetchData()){const previousSector=q('#ro-sector').value,previousType=q('#ro-type').value;q('#ro-sector').replaceChildren(new Option('Todos os setores',''),...data.setores.map(s=>new Option(s,s)));q('#ro-type').replaceChildren(new Option('Todos os tipos',''),...[...new Set(data.mov.map(m=>m[1]))].map(t=>new Option(t,t)));q('#ro-sector').value=previousSector;q('#ro-type').value=previousType;render();}}catch(e){q('footer').textContent='Sem conexão · exibindo a última consulta carregada.';}finally{loading=false;}},60000);}catch(e){q('#ro-list-count').textContent='Não foi possível carregar os dados. Recarregue a página para tentar novamente.';q('footer').textContent='Falha de conexão com a base do rebanho.';q('#ro-xlsx').disabled=q('#ro-pdf').disabled=true;console.error(e)}})();
</script>
</div>
</body></html>
